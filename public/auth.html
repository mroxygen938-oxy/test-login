<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0E0B1F" />
  <title>Oxygen Vault — Sign in</title>
  <link rel="icon" href="/logo-32.png" />
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #0E0B1F;
      color: #f4f3f8;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 24px;
      padding: 24px;
      text-align: center;
    }
    .logo {
      width: 96px;
      height: 96px;
      object-fit: contain;
      border-radius: 22px;
      box-shadow: 0 0 40px rgba(124,58,237,0.45);
    }
    h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    p {
      margin: 0;
      max-width: 320px;
      color: #b4b2c8;
      font-size: 14px;
      line-height: 1.55;
    }
    .widget-wrap {
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .return-btn {
      display: none;
      margin-top: 8px;
      padding: 12px 20px;
      border-radius: 999px;
      border: none;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      background: linear-gradient(135deg, #7c3aed 0%, #a855f7 45%, #ec4899 100%);
      box-shadow: 0 8px 22px rgba(236,72,153,0.35);
      text-decoration: none;
    }
    .return-btn.visible { display: inline-flex; }
    .status {
      font-size: 12px;
      color: #7d7a92;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .err {
      color: #ff6b8a;
    }
  </style>
</head>
<body>
  <img src="/logo-256.png" alt="Oxygen Vault" class="logo" />
  <h1>Sign in to Oxygen Vault</h1>
  <p id="instructions">
    Tap the Telegram button below. Once you authorise, this page will
    automatically return you to the app.
  </p>
  <div class="widget-wrap" id="widget"></div>
  <a id="return" class="return-btn" href="#">Open Oxygen Vault</a>
  <div class="status" id="status"></div>

  <script>
    (function () {
      var qs = new URLSearchParams(window.location.search)
      var returnTo = qs.get('return_to') || 'oxygenvault://auth'
      var statusEl = document.getElementById('status')
      var returnEl = document.getElementById('return')
      var instructions = document.getElementById('instructions')

      function setStatus(text, isErr) {
        statusEl.textContent = text || ''
        statusEl.className = 'status' + (isErr ? ' err' : '')
      }

      function bounceBack(payload) {
        try {
          var enc = btoa(unescape(encodeURIComponent(JSON.stringify(payload))))
          var sep = returnTo.indexOf('?') === -1 ? '?' : '&'
          var url = returnTo + sep + 'payload=' + encodeURIComponent(enc)
          returnEl.href = url
          returnEl.classList.add('visible')
          instructions.textContent =
            'Authorised. Returning you to Oxygen Vault…'
          setStatus('If nothing happens in 2 seconds, tap the button.')
          /* Try auto-redirect first; the manual button is the
             fallback for browsers that block scripted scheme jumps. */
          setTimeout(function () {
            window.location.href = url
          }, 80)
        } catch (e) {
          setStatus('Could not encode payload: ' + e.message, true)
        }
      }

      window.onTelegramAuth = function (payload) {
        if (!payload || !payload.hash) {
          setStatus('Telegram returned an empty payload.', true)
          return
        }
        bounceBack(payload)
      }

      var s = document.createElement('script')
      s.async = true
      s.src = 'https://telegram.org/js/telegram-widget.js?22'
      s.setAttribute('data-telegram-login', 'OxygenVaultbot')
      s.setAttribute('data-size', 'large')
      s.setAttribute('data-userpic', 'true')
      s.setAttribute('data-request-access', 'write')
      s.setAttribute('data-onauth', 'onTelegramAuth(user)')
      document.getElementById('widget').appendChild(s)
    })()
  </script>
</body>
</html>
